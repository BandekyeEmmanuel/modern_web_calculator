

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator interface">
     <div class="calculator-body">
      <div class="display1">0</div>
     </div>
    </div>

    <div class="keypad">
      <button class="clear" type="button">AC</button>
      <button class="utility" type="button">00</button>
      <button class="utility" type="button">%</button>
      <button class="operator" type="button">÷</button>

      <button type="button">7</button>
      <button type="button">8</button>
      <button type="button">9</button>
      <button class="operator" type="button">×</button>

      <button type="button">4</button>
      <button type="button">5</button>
      <button type="button">6</button>
      <button class="operator" type="button">−</button>

      <button type="button">1</button>
      <button type="button">2</button>
      <button type="button">3</button>
      <button class="operator" type="button">+</button>

      <button class="zero" type="button">0</button>
      <button type="button">.</button>
      <button class="equals" type="button">=</button>
    </div>
  </main>
</body>
</html>
